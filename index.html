<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Deal Feed — Assets</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 48px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    h1 {
      font-size: 2rem;
      margin: 0 0 12px;
      color: #1a1a1a;
    }
    .subtitle {
      color: #666;
      margin-bottom: 32px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a {
      display: block;
      padding: 14px 24px;
      background: #f5f5f5;
      border-radius: 12px;
      text-decoration: none;
      color: #333;
      font-weight: 500;
      transition: all 0.2s;
    }
    a:hover {
      background: #1a1a1a;
      color: white;
    }
    .main-link {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .main-link:hover {
      opacity: 0.9;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .footer {
      margin-top: 32px;
      font-size: 0.85rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>@dailydealfeed ✨</h1>
    <p class="subtitle">Asset hosting for dailydealfeed.carrd.co</p>
    
    <div class="links">
      <a href="https://dailydealfeed.carrd.co" class="main-link">Visit the Site →</a>
      <a href="./products.json">products.json</a>
      <a href="./embed.html">embed.html</a>
    </div>
    
    <p class="footer">
      Follow us on <a href="https://instagram.com/dailydealfeed" style="background: none; padding: 0; display: inline; color: #667eea;">Instagram</a> 
      & <a href="https://tiktok.com/@dailydealfeed" style="background: none; padding: 0; display: inline; color: #667eea;">TikTok</a>
    </p>
  </div>
</body>
</html>
