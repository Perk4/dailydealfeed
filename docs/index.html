<!DOCTYPE html>
<html>
<head>
    <title>DailyDealFeed - Video Preview</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #0a0a0a; 
            color: #fff; 
            padding: 20px;
            min-height: 100vh;
        }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 24px; margin-bottom: 8px; }
        .header p { color: #888; font-size: 14px; }
        .badge { 
            display: inline-block;
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%); 
            padding: 4px 12px; 
            border-radius: 12px; 
            font-size: 11px; 
            margin-left: 8px;
            color: #000;
            font-weight: 600;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 20px; 
            max-width: 1400px;
            margin: 0 auto;
        }
        .card { 
            background: #1a1a1a; 
            border-radius: 16px; 
            overflow: hidden;
            border: 1px solid #333;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #4ade80;
        }
        .card-header {
            padding: 16px;
            border-bottom: 1px solid #333;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .product-img {
            width: 56px;
            height: 56px;
            object-fit: contain;
            background: #fff;
            border-radius: 10px;
            padding: 4px;
            flex-shrink: 0;
        }
        .product-img-fallback {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #ff9900, #ffb347);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        .product-info {
            flex: 1;
            min-width: 0;
        }
        .card-header h3 { 
            font-size: 14px; 
            margin-bottom: 4px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-header .price { 
            color: #4ade80; 
            font-weight: 700; 
            font-size: 18px; 
        }
        .video-container {
            position: relative;
            background: #000;
            aspect-ratio: 9/16;
            max-height: 500px;
        }
        .card video { 
            width: 100%; 
            height: 100%;
            object-fit: contain;
        }
        .card-footer {
            padding: 12px 16px;
            background: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .meta { display: flex; gap: 6px; flex-wrap: wrap; }
        .meta span { 
            background: #333; 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 11px; 
        }
        .meta .voice { background: #4ade80; color: #000; }
        .meta .amazon { background: #ff9900; color: #000; }
        .buy-link {
            background: linear-gradient(135deg, #ff9900, #ffb347);
            color: #000;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
            white-space: nowrap;
            transition: transform 0.2s ease;
        }
        .buy-link:hover {
            transform: scale(1.05);
        }
        .footer { 
            text-align: center; 
            padding: 32px; 
            color: #666; 
            font-size: 12px;
        }
        .loading { text-align: center; padding: 40px; color: #888; }
        .embed-url {
            background: #222;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 10px;
            color: #888;
            margin-top: 8px;
            word-break: break-all;
            cursor: pointer;
        }
        .embed-url:hover {
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📦 DailyDealFeed Preview <span class="badge" id="count">Loading...</span></h1>
        <p>Automated affiliate videos • 9:16 vertical • Ready to post</p>
    </div>
    
    <div class="grid" id="grid">
        <div class="loading">Loading videos...</div>
    </div>
    
    <div class="footer">
        <p>🔊 Turn on sound for voiceover</p>
        <p style="margin-top: 8px; color: #555;">As an Amazon Associate I earn from qualifying purchases</p>
    </div>

    <script>
        const AFFILIATE_TAG = 'dailydealfeed-20';
        const BASE = 'https://raw.githubusercontent.com/Perk4/dailydealfeed/main';
        const EMBED_BASE = 'https://perk4.github.io/dailydealfeed';
        
        let manifestProducts = [];
        
        async function loadVideos() {
            try {
                // First load the manifest for ASIN data
                const manifestRes = await fetch(`${BASE}/staging/products/manifest.json?t=${Date.now()}`);
                const manifest = await manifestRes.json();
                manifestProducts = manifest.products || [];
                
                // Get list of all files in approved folder
                const res = await fetch('https://api.github.com/repos/Perk4/dailydealfeed/contents/output/approved');
                const files = await res.json();
                
                if (!Array.isArray(files)) {
                    throw new Error('Failed to load file list');
                }
                
                // Find videos
                const videos = files.filter(f => f.name.startsWith('video_') && f.name.endsWith('.mp4'));
                
                // Find post JSON files for metadata
                const posts = files.filter(f => f.name.startsWith('post_') && f.name.endsWith('.json'));
                
                // Update count
                document.getElementById('count').textContent = `${videos.length} VIDEOS`;
                
                const grid = document.getElementById('grid');
                grid.innerHTML = '';
                
                // Sort videos by timestamp (newest first)
                videos.sort((a, b) => {
                    const tsA = parseInt(a.name.match(/_(\d+)\.mp4$/)?.[1] || 0);
                    const tsB = parseInt(b.name.match(/_(\d+)\.mp4$/)?.[1] || 0);
                    return tsB - tsA;
                });
                
                for (const video of videos) {
                    // Extract product_id from filename (video_10_123456.mp4 -> 10)
                    const productIdMatch = video.name.match(/^video_(\d+)_/);
                    const productId = productIdMatch ? parseInt(productIdMatch[1]) : null;
                    
                    // Try to get product info from corresponding post JSON
                    const postName = video.name.replace('video_', 'post_').replace('.mp4', '.json');
                    const postFile = posts.find(p => p.name === postName);
                    
                    let productName = 'Product';
                    let productPrice = '';
                    let asin = null;
                    
                    if (postFile) {
                        try {
                            const postRes = await fetch(postFile.download_url);
                            const postData = await postRes.json();
                            // Use correct field names from post JSON
                            productName = postData.product_name || 'Product';
                            productPrice = postData.product_price || '';
                        } catch (e) {
                            console.warn('Could not load post data:', e);
                        }
                    }
                    
                    // Get ASIN from manifest using product_id
                    if (productId && manifestProducts[productId - 1]) {
                        asin = manifestProducts[productId - 1].asin;
                        // Fallback to manifest data if post didn't have it
                        if (!productName || productName === 'Product') {
                            productName = manifestProducts[productId - 1].name;
                        }
                        if (!productPrice) {
                            productPrice = manifestProducts[productId - 1].price;
                        }
                    }
                    
                    const imageUrl = asin 
                        ? `https://images-na.ssl-images-amazon.com/images/P/${asin}.jpg`
                        : null;
                    const affiliateLink = asin 
                        ? `https://www.amazon.com/dp/${asin}?tag=${AFFILIATE_TAG}`
                        : '#';
                    const embedUrl = productId 
                        ? `${EMBED_BASE}/video-embed.html?id=${productId}`
                        : null;
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">
                            ${imageUrl 
                                ? `<img class="product-img" src="${imageUrl}" alt="${truncate(productName, 30)}" onerror="this.outerHTML='<div class=\\'product-img-fallback\\'>📦</div>'">`
                                : '<div class="product-img-fallback">📦</div>'
                            }
                            <div class="product-info">
                                <h3>${truncate(productName, 50)}</h3>
                                ${productPrice ? `<div class="price">${productPrice}</div>` : ''}
                            </div>
                        </div>
                        <div class="video-container">
                            <video controls playsinline preload="metadata">
                                <source src="${BASE}/output/approved/${video.name}" type="video/mp4">
                            </video>
                        </div>
                        <div class="card-footer">
                            <div class="meta">
                                <span class="voice">🎙️ TTS</span>
                                <span class="amazon">🛒 Amazon</span>
                                <span>9:16</span>
                            </div>
                            ${asin ? `<a class="buy-link" href="${affiliateLink}" target="_blank" rel="noopener">Shop →</a>` : ''}
                        </div>
                        ${embedUrl ? `<div class="embed-url" onclick="copyToClipboard('${embedUrl}')" title="Click to copy embed URL">${embedUrl}</div>` : ''}
                    `;
                    grid.appendChild(card);
                }
                
                if (grid.children.length === 0) {
                    grid.innerHTML = '<div class="loading">No videos found in output/approved/</div>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('grid').innerHTML = `<div class="loading">Error loading videos: ${err.message}</div>`;
            }
        }
        
        function truncate(str, len) {
            if (!str) return '';
            return str.length > len ? str.substring(0, len) + '...' : str;
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Embed URL copied!');
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }
        
        loadVideos();
    </script>
</body>
</html>
