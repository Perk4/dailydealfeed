<!--
  Daily Deal Feed — Mobile-First Product Links
  Optimized for TikTok/Instagram bio links
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daily Deal Feed</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 80px;
    }

    .header {
      text-align: center;
      padding: 24px 0;
      margin-bottom: 20px;
    }

    .header h1 {
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .header p {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
    }

    .product-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    .product-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }

    .product-card:hover, .product-card:active {
      transform: translateY(-2px) scale(1.01);
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.2);
    }

    .product-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    }

    .product-image {
      width: 88px;
      height: 88px;
      border-radius: 14px;
      object-fit: contain;
      background: #fff;
      flex-shrink: 0;
      padding: 8px;
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-name {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-tagline {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .product-price {
      font-size: 18px;
      font-weight: 700;
      color: #4ade80;
    }

    .prime-badge {
      background: linear-gradient(135deg, #ff9900 0%, #ffb347 100%);
      color: #000;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .arrow-icon {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .product-card:hover .arrow-icon {
      background: #4ade80;
    }

    .arrow-icon svg {
      width: 16px;
      height: 16px;
      fill: #fff;
    }

    .footer {
      text-align: center;
      padding: 32px 0 16px;
      color: rgba(255,255,255,0.4);
      font-size: 12px;
    }

    .footer a {
      color: rgba(255,255,255,0.6);
      text-decoration: none;
    }

    /* Loading animation */
    @keyframes shimmer {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    .loading .product-card {
      animation: shimmer 1.5s infinite;
    }

    /* Coupon badge */
    .coupon-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔥 Daily Deal Feed</h1>
    <p>TikTok made me buy it (and you should too)</p>
  </div>

  <div class="product-grid" id="products">
    <!-- Products loaded dynamically -->
  </div>

  <div class="footer">
    <p>As an Amazon Associate I earn from qualifying purchases</p>
    <p style="margin-top: 8px;"><a href="https://instagram.com/dailydealfeed">@dailydealfeed</a></p>
  </div>

  <script>
    const STORE_ID = 'dailydealfeed-20';
    const DATA_URL = 'https://perk4.github.io/dailydealfeed/products.json';

    async function loadProducts() {
      try {
        const res = await fetch(DATA_URL + '?t=' + Date.now());
        const data = await res.json();
        renderProducts(data.products);
      } catch (err) {
        console.error('Failed to load products:', err);
      }
    }

    function renderProducts(products) {
      const grid = document.getElementById('products');
      grid.innerHTML = products.map(p => `
        <a href="https://www.amazon.com/dp/${p.asin}?tag=${STORE_ID}" 
           class="product-card" 
           target="_blank" 
           rel="noopener">
          ${p.coupon_code ? `<span class="coupon-badge">Save ${p.discount_percent || '10'}%</span>` : ''}
          <img class="product-image" 
               src="${p.image}" 
               alt="${p.name}"
               loading="lazy">
          <div class="product-info">
            <div class="product-name">${truncate(p.name, 50)}</div>
            <div class="product-tagline">${p.tagline || ''}</div>
            <div class="product-meta">
              <span class="product-price">${p.price}</span>
              ${p.prime ? '<span class="prime-badge">PRIME</span>' : ''}
            </div>
          </div>
          <div class="arrow-icon">
            <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
          </div>
        </a>
      `).join('');
    }

    function truncate(str, len) {
      if (!str) return '';
      return str.length > len ? str.substring(0, len) + '...' : str;
    }

    // Load on page ready
    document.addEventListener('DOMContentLoaded', loadProducts);
  </script>
</body>
</html>
