<!--
  Daily Deal Feed — Product Embed
  Add this to Carrd using the Embed widget
-->
<style>
  .ddf-container {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }
  
  .ddf-header {
    text-align: center;
    margin-bottom: 30px;
  }
  
  .ddf-header h2 {
    font-size: 1.8rem;
    font-weight: 600;
    color: #1a1a1a;
    margin: 0 0 8px 0;
  }
  
  .ddf-header p {
    color: #666;
    font-size: 1rem;
    margin: 0;
  }
  
  .ddf-filter-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  
  .ddf-filter-btn {
    background: #f5f5f5;
    border: none;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #444;
  }
  
  .ddf-filter-btn:hover {
    background: #e8e8e8;
  }
  
  .ddf-filter-btn.active {
    background: #1a1a1a;
    color: white;
  }
  
  .ddf-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
  }
  
  .ddf-card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  
  .ddf-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  
  .ddf-card-image {
    width: 100%;
    height: 200px;
    object-fit: contain;
    background: #fafafa;
    padding: 20px;
  }
  
  .ddf-card-content {
    padding: 16px 20px 20px;
  }
  
  .ddf-card-category {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #888;
    margin-bottom: 6px;
  }
  
  .ddf-card-name {
    font-size: 1.1rem;
    font-weight: 600;
    color: #1a1a1a;
    margin: 0 0 6px 0;
  }
  
  .ddf-card-tagline {
    font-size: 0.9rem;
    color: #666;
    margin: 0 0 12px 0;
    line-height: 1.4;
  }
  
  /* Price styling */
  .ddf-card-price-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  
  .ddf-card-price {
    font-size: 1.2rem;
    font-weight: 700;
    color: #2d8f2d;
  }
  
  .ddf-card-original-price {
    font-size: 0.95rem;
    color: #999;
    text-decoration: line-through;
  }
  
  .ddf-discount-badge {
    background: linear-gradient(135deg, #ff4444, #cc0000);
    color: white;
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  
  .ddf-featured-badge {
    background: linear-gradient(135deg, #ff6b6b, #ff8e53);
    color: white;
    font-size: 0.7rem;
    padding: 4px 10px;
    border-radius: 12px;
    display: inline-block;
    margin-left: 8px;
    font-weight: 600;
    text-transform: uppercase;
  }
  
  /* Coupon styling */
  .ddf-coupon {
    background: linear-gradient(135deg, #fffef0 0%, #fff9e6 100%);
    border: 2px dashed #e6a700;
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    position: relative;
  }
  
  .ddf-coupon::before {
    content: "✂️";
    position: absolute;
    top: -10px;
    left: 10px;
    font-size: 14px;
    background: #fff;
    padding: 0 4px;
  }
  
  .ddf-coupon-label {
    font-size: 0.7rem;
    color: #996600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  
  .ddf-coupon-code {
    font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
    font-size: 1rem;
    font-weight: 700;
    color: #b35c00;
    background: #fff;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid #e6a700;
    letter-spacing: 1px;
  }
  
  .ddf-coupon-copy {
    background: #ffc107;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #333;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  
  .ddf-coupon-copy:hover {
    background: #ffca2c;
    transform: scale(1.05);
  }
  
  .ddf-coupon-copy.copied {
    background: #28a745;
    color: white;
  }
  
  .ddf-loading {
    text-align: center;
    padding: 60px 20px;
    color: #888;
  }
  
  .ddf-error {
    text-align: center;
    padding: 40px 20px;
    color: #c33;
    background: #fff5f5;
    border-radius: 12px;
  }
  
  @media (max-width: 640px) {
    .ddf-container {
      padding: 16px;
    }
    
    .ddf-grid {
      grid-template-columns: 1fr;
      gap: 16px;
    }
    
    .ddf-header h2 {
      font-size: 1.5rem;
    }
    
    .ddf-card-image {
      height: 180px;
    }
    
    .ddf-coupon {
      flex-wrap: wrap;
    }
    
    .ddf-coupon-code {
      font-size: 0.9rem;
    }
  }
</style>

<div class="ddf-container">
  <div class="ddf-header">
    <h2>today's finds ✨</h2>
    <p>stuff we actually use (or wish we thought of sooner)</p>
  </div>
  
  <div class="ddf-filter-bar">
    <button class="ddf-filter-btn active" data-filter="all">All</button>
    <button class="ddf-filter-btn" data-filter="tech">Tech</button>
    <button class="ddf-filter-btn" data-filter="home">Home</button>
    <button class="ddf-filter-btn" data-filter="wellness">Wellness</button>
  </div>
  
  <div id="ddf-products" class="ddf-grid">
    <div class="ddf-loading">Loading deals...</div>
  </div>
</div>

<script>
(function() {
  const PRODUCTS_URL = 'https://perk4.github.io/dailydealfeed/products.json';
  let allProducts = [];
  let currentFilter = 'all';
  
  // Copy coupon code to clipboard
  window.ddfCopyCode = function(code, event) {
    event.preventDefault();
    event.stopPropagation();
    
    const btn = event.currentTarget;
    
    navigator.clipboard.writeText(code).then(() => {
      const originalText = btn.innerHTML;
      btn.innerHTML = '✓ Copied!';
      btn.classList.add('copied');
      
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.classList.remove('copied');
      }, 2000);
    }).catch(err => {
      // Fallback for older browsers
      const textArea = document.createElement('textarea');
      textArea.value = code;
      textArea.style.position = 'fixed';
      textArea.style.left = '-999999px';
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        btn.innerHTML = '✓ Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.innerHTML = '📋 Copy';
          btn.classList.remove('copied');
        }, 2000);
      } catch (e) {
        console.error('Copy failed', e);
      }
      document.body.removeChild(textArea);
    });
  };
  
  // Format price display
  function formatPrice(product) {
    const currentPrice = product.price;
    const originalPrice = product.original_price;
    const discount = product.discount_percent;
    
    let html = `<span class="ddf-card-price">${currentPrice}</span>`;
    
    if (originalPrice && originalPrice !== currentPrice) {
      html += ` <span class="ddf-card-original-price">${originalPrice}</span>`;
    }
    
    if (discount) {
      html += ` <span class="ddf-discount-badge">-${discount}%</span>`;
    }
    
    return html;
  }
  
  // Generate coupon HTML
  function formatCoupon(product) {
    if (!product.coupon_code) return '';
    
    const code = product.coupon_code;
    return `
      <div class="ddf-coupon" onclick="event.stopPropagation();">
        <div>
          <div class="ddf-coupon-label">Use code at checkout</div>
          <span class="ddf-coupon-code">${code}</span>
        </div>
        <button class="ddf-coupon-copy" onclick="ddfCopyCode('${code}', event)">📋 Copy</button>
      </div>
    `;
  }
  
  // Track clicks
  function trackClick(product) {
    console.log('[DDF Click]', {
      id: product.id,
      name: product.name,
      category: product.category,
      price: product.price,
      coupon_code: product.coupon_code || null,
      timestamp: new Date().toISOString()
    });
    // Future: Add GA4 event here
    // gtag('event', 'product_click', { product_id: product.id, product_name: product.name });
  }
  
  // Render products
  function renderProducts(products) {
    const container = document.getElementById('ddf-products');
    
    if (!products.length) {
      container.innerHTML = '<div class="ddf-loading">No products found</div>';
      return;
    }
    
    const filtered = currentFilter === 'all' 
      ? products 
      : products.filter(p => p.category === currentFilter);
    
    container.innerHTML = filtered.map(product => `
      <a href="${product.link}" 
         target="_blank" 
         rel="noopener" 
         class="ddf-card" 
         data-product-id="${product.id}"
         onclick="window.ddfTrack && window.ddfTrack(${product.id})">
        <img class="ddf-card-image" 
             src="${product.image}" 
             alt="${product.name}"
             loading="lazy"
             onerror="this.src='https://via.placeholder.com/280x200?text=Image+Loading'">
        <div class="ddf-card-content">
          <div class="ddf-card-category">${product.category}</div>
          <h3 class="ddf-card-name">
            ${product.name}
            ${product.featured ? '<span class="ddf-featured-badge">Hot</span>' : ''}
          </h3>
          <p class="ddf-card-tagline">"${product.tagline}"</p>
          <div class="ddf-card-price-row">
            ${formatPrice(product)}
          </div>
          ${formatCoupon(product)}
        </div>
      </a>
    `).join('');
  }
  
  // Setup filter buttons
  function setupFilters() {
    document.querySelectorAll('.ddf-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.ddf-filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderProducts(allProducts);
      });
    });
  }
  
  // Expose track function globally
  window.ddfTrack = function(productId) {
    const product = allProducts.find(p => p.id === String(productId));
    if (product) trackClick(product);
  };
  
  // Fetch and render
  fetch(PRODUCTS_URL)
    .then(res => {
      if (!res.ok) throw new Error('Failed to load products');
      return res.json();
    })
    .then(data => {
      allProducts = data.products || [];
      renderProducts(allProducts);
      setupFilters();
    })
    .catch(err => {
      console.error('[DDF Error]', err);
      document.getElementById('ddf-products').innerHTML = `
        <div class="ddf-error">
          <p>Couldn't load products right now 😅</p>
          <p style="font-size: 0.85rem; margin-top: 8px;">Try refreshing the page</p>
        </div>
      `;
    });
})();
</script>
